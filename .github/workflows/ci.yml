name: DevOps Flask CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-scan:
    name: Code Quality & Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Linters
        run: |
          python -m pip install --upgrade pip
          pip install flake8 bandit

      - name: Run Flake8 (Code Style Check)
        run: flake8 app/ --max-line-length=120 --ignore=E501,W503,W293,E302,E305,W292

      - name: Run Bandit (Python Security Check)
        run: bandit -r app/

  build-and-test:
    name: Build & Integration Tests
    needs: lint-and-scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create env file
        run: |
          echo "DB_HOST=db" >> .env
          echo "DB_NAME=${{ secrets.DB_NAME || 'devopsdb' }}" >> .env
          echo "DB_USER=${{ secrets.DB_USER || 'devopsuser' }}" >> .env
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD || 'devopspassword' }}" >> .env

      - name: Build Docker containers
        run: docker compose build

      - name: Scan Docker Image for Vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'devops-flask-project-app:latest'
          format: 'table'
          exit-code: '0'
          severity: 'HIGH,CRITICAL'

      - name: Start containers
        run: docker compose up -d

      - name: Check health endpoint (Dynamic Wait)
        run: |
          echo "Waiting for app to become healthy..."
          for i in {1..30}; do
            if curl -s -f http://localhost:8080/health; then
              echo "Health check passed!"
              exit 0
            fi
            echo "Waiting..."
            sleep 2
          done
          echo "Health check failed!"
          docker compose logs
          exit 1

      - name: Stop containers
        if: always()
        run: docker compose down

  deploy:
    name: Continuous Deployment
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create env file
        run: |
          echo "DB_HOST=db" > .env
          echo "DB_NAME=${{ secrets.DB_NAME || 'devopsdb' }}" >> .env
          echo "DB_USER=${{ secrets.DB_USER || 'devopsuser' }}" >> .env
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD || 'devopspassword' }}" >> .env

      - name: Deploy containers on Ubuntu server
        run: |
          docker compose down
          docker compose up -d --build